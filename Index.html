<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerbang Absensi — Sistem Kehadiran Kantor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --surface:#121B2E;
    --surface2:#1B2745;
    --border:#28345A;
    --border-soft:#1F2B4A;
    --text:#EAF0FB;
    --muted:#8695B7;
    --muted2:#5C6B94;
    --accent:#5EEAD4;
    --accent-dim:#1F5C56;
    --ok:#34D399;
    --ok-dim:#123829;
    --warn:#FBBF24;
    --warn-dim:#3A2E0D;
    --danger:#FB7185;
    --danger-dim:#3A1620;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #16224A 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, #0F2E33 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 40px;position:relative;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---- Topbar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 14px;position:sticky;top:0;
    background:linear-gradient(180deg, rgba(11,18,32,.97), rgba(11,18,32,.88));
    backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#2A8F86);display:flex;align-items:center;justify-content:center;font-weight:700;color:#04211E;font-family:'Space Grotesk',sans-serif;font-size:15px;}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;letter-spacing:.2px;}
  .brand-sub{font-size:10.5px;color:var(--muted2);letter-spacing:.6px;text-transform:uppercase;margin-top:1px;}
  .icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;}

  .content{padding:20px;}

  /* ---- Generic ---- */
  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;margin:0 0 6px;}
  .h2{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin:0 0 10px;}
  .muted{color:var(--muted);font-size:13px;line-height:1.55;}
  .btn{
    width:100%;padding:14px 16px;border-radius:12px;border:none;font-weight:600;font-size:14.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#38B2A3);color:#04211E;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid #4E1F2B;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-sm{padding:9px 12px;font-size:12.5px;width:auto;border-radius:9px;}
  .btn:disabled{opacity:.4;pointer-events:none;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;letter-spacing:.2px;}
  .field input, .field select{
    width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:12px 13px;border-radius:10px;font-size:14.5px;outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px;}
  .badge-ok{background:var(--ok-dim);color:var(--ok);}
  .badge-warn{background:var(--warn-dim);color:var(--warn);}
  .badge-danger{background:var(--danger-dim);color:var(--danger);}
  .badge-muted{background:var(--surface2);color:var(--muted);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .divider{height:1px;background:var(--border-soft);margin:14px 0;}

  /* ---- Role select ---- */
  .role-card{display:flex;align-items:center;gap:14px;padding:20px;border-radius:16px;border:1px solid var(--border-soft);background:var(--surface);margin-bottom:12px;}
  .role-card:active{background:var(--surface2);}
  .role-ico{width:46px;height:46px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}

  /* ---- Clock ---- */
  .clock-wrap{text-align:center;padding:26px 10px 20px;}
  .clock{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;letter-spacing:1px;}
  .clock-date{color:var(--muted);font-size:13px;margin-top:4px;}
  .shift-pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 14px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--accent);}

  /* ---- Status rows ---- */
  .attend-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
  .attend-row + .attend-row{border-top:1px solid var(--border-soft);}
  .attend-label{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .attend-value{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;}

  /* ---- Radar / scan visuals ---- */
  .radar{position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;background:radial-gradient(circle, rgba(94,234,212,.10), transparent 70%);display:flex;align-items:center;justify-content:center;}
  .radar-ring{position:absolute;border:1px solid rgba(94,234,212,.35);border-radius:50%;}
  .radar-ring.r1{width:150px;height:150px;}
  .radar-ring.r2{width:105px;height:105px;}
  .radar-ring.r3{width:60px;height:60px;}
  .radar-ping{position:absolute;width:150px;height:150px;border-radius:50%;border:1px solid var(--accent);opacity:0;animation:ping 2.2s cubic-bezier(0,.4,.6,1) infinite;}
  @keyframes ping{0%{transform:scale(.3);opacity:.8;}100%{transform:scale(1);opacity:0;}}
  .radar-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px 3px rgba(94,234,212,.7);z-index:2;}
  .radar-dot.bad{background:var(--danger);box-shadow:0 0 14px 3px rgba(251,113,133,.7);}

  .scan-frame{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--border);}
  .scan-frame video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  .scan-overlay{position:absolute;inset:0;pointer-events:none;}
  .scan-oval{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:64%;height:56%;border:2px solid var(--accent);border-radius:50%;opacity:.75;}
  .scan-line{position:absolute;left:8%;width:84%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 2s ease-in-out infinite;}
  @keyframes scan{0%{top:20%;}50%{top:75%;}100%{top:20%;}}
  .scan-status{position:absolute;bottom:10px;left:8px;right:8px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.4;color:var(--accent);text-shadow:0 1px 4px rgba(0,0,0,.8);background:rgba(0,0,0,.35);border-radius:8px;padding:6px 8px;}

  /* ---- Steps ---- */
  .step-track{display:flex;align-items:center;gap:6px;margin-bottom:18px;}
  .step-dot{flex:1;height:3px;border-radius:3px;background:var(--border);}
  .step-dot.active{background:var(--accent);}
  .step-dot.done{background:var(--ok);}

  /* ---- Modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(4,7,15,.7);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{width:100%;max-width:480px;background:var(--bg);border-radius:22px 22px 0 0;border:1px solid var(--border-soft);border-bottom:none;max-height:92vh;overflow-y:auto;padding:20px 20px 28px;animation:sheetup .25s ease;}
  @keyframes sheetup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 16px;}

  /* ---- Tabs (admin) ---- */
  .tabbar{display:flex;gap:6px;position:sticky;top:64px;z-index:15;background:var(--bg);padding:4px 0 14px;overflow-x:auto;}
  .tab{padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border-soft);white-space:nowrap;}
  .tab.active{color:#04211E;background:var(--accent);border-color:var(--accent);}

  table.rec-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.rec-table th{text-align:left;color:var(--muted2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:0 8px 8px 0;}
  table.rec-table td{padding:9px 8px 9px 0;border-top:1px solid var(--border-soft);vertical-align:top;}

  .emp-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-soft);}
  .emp-row:first-child{border-top:none;}
  .avatar-init{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);padding:12px 18px;border-radius:12px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90%;text-align:center;}

  .empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px;}

  code.inline{background:var(--surface2);padding:2px 6px;border-radius:5px;font-size:12px;}
  .guide pre{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
  .guide h3{font-family:'Space Grotesk',sans-serif;font-size:14px;margin:18px 0 6px;color:var(--accent);}
  .guide ol{padding-left:18px;font-size:13px;color:var(--text);line-height:1.7;}
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<!-- face-api.js for on-device face verification -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
/* =========================================================
   GERBANG ABSENSI — Konfigurasi
   ========================================================= */

// >>> GANTI dengan konfigurasi Firebase project ANDA (lihat panduan di app > tombol "Panduan Setup") <<<
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD2c822KpaTa0kGm4rQOHogcg77yvnjD2M",
  authDomain: "absensi-kantor-dc1e8.firebaseapp.com",
  databaseURL: "https://absensi-kantor-dc1e8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absensi-kantor-dc1e8",
  storageBucket: "absensi-kantor-dc1e8.firebasestorage.app",
  messagingSenderId: "330758092410",
  appId: "1:330758092410:web:e9562290e66f074c2bedc3"
};

const FACE_MODELS_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
const FACE_MATCH_THRESHOLD = 0.55; // makin kecil = makin ketat. 0.6 = default face-api
const TOLERANCE_MIN = 15;          // toleransi telat/pulang cepat (menit)
const DEFAULT_RADIUS = 150;        // meter, jika lokasi kantor belum diset

const SHIFTS = {
  shift1: { key:'shift1', name:'Shift 1 — Pagi', startH:7, startM:0, endH:17, endM:0, overnight:false },
  shift2: { key:'shift2', name:'Shift 2 — Malam', startH:18, startM:0, endH:6, endM:0, overnight:true }
};

let fbApp, db;
let firebaseReady = false;
try{
  if(!FIREBASE_CONFIG.apiKey.includes('PASTE')){
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    firebaseReady = true;
  }
}catch(e){ console.error('Firebase init error', e); }

let faceModelsLoaded = false;

/* =========================================================
   State
   ========================================================= */
const S = {
  screen: firebaseReady ? 'role' : 'setup',
  session: null,        // {type:'employee'|'admin', emp?:{...}}
  employees: {},         // id -> data
  attendance: {},        // id -> {dateKey: record}
  officeConfig: { lat:null, lng:null, radius: DEFAULT_RADIUS, name:'Kantor' },
  adminPin: '1234',
  loadingMsg: '',
  toastMsg: null,
  modal: null,           // {type, ...}
  admin: { tab:'karyawan', filterDate: todayKey() }
};

/* =========================================================
   Utils
   ========================================================= */
function pad2(n){ return n.toString().padStart(2,'0'); }
function todayKey(d){ d = d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtTime(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
function fmtHM(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtDateLong(d){
  const days=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return days[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}
function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function euclid(a,b){ let s=0; for(let i=0;i<a.length;i++) s+=(a[i]-b[i])**2; return Math.sqrt(s); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function showToast(msg, ms){ S.toastMsg = msg; render(); clearTimeout(window.__t); window.__t=setTimeout(()=>{S.toastMsg=null; render();}, ms||2400); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setScreen(name){ S.screen = name; window.scrollTo(0,0); render(); }
function openModal(m){ S.modal = m; render(); }
function closeModal(){ S.modal = null; render(); }

/* =========================================================
   Data loading (Firebase)
   ========================================================= */
function loadAllData(cb){
  if(!firebaseReady) return;
  let pending = 3;
  const done = ()=>{ pending--; if(pending===0 && cb) cb(); render(); };
  db.ref('employees').on('value', snap=>{ S.employees = snap.val()||{}; done(); });
  db.ref('attendance').on('value', snap=>{ S.attendance = snap.val()||{}; done(); });
  db.ref('config').on('value', snap=>{
    const v = snap.val();
    if(v){
      if(v.office) S.officeConfig = Object.assign(S.officeConfig, v.office);
      if(v.adminPin) S.adminPin = v.adminPin;
    }
    done();
  });
}

/* =========================================================
   Shift logic
   ========================================================= */
function scheduledDate(baseDate, hour, minute){
  const d = new Date(baseDate);
  d.setHours(hour, minute, 0, 0);
  return d;
}
// Tentukan shift untuk ABSEN MASUK berdasarkan jam sekarang
function guessShiftForMasuk(now){
  const mins = now.getHours()*60 + now.getMinutes();
  const s1Window = [5*60, 11*60];      // 05:00–11:00 -> shift 1
  const s2Window = [16*60, 23*60+59];  // 16:00–23:59 -> shift 2
  if(mins>=s1Window[0] && mins<=s1Window[1]) return { shift:SHIFTS.shift1, inWindow:true };
  if(mins>=s2Window[0] && mins<=s2Window[1]) return { shift:SHIFTS.shift2, inWindow:true };
  // di luar jendela normal -> pilih shift terdekat scr jarak sirkular, tandai anomali
  const s1c = 7*60, s2c = 18*60;
  const circ = (a,b)=>{ let d=Math.abs(a-b); return Math.min(d, 1440-d); };
  const shift = circ(mins,s1c) <= circ(mins,s2c) ? SHIFTS.shift1 : SHIFTS.shift2;
  return { shift, inWindow:false };
}
function statusMasuk(now, shift){
  const start = scheduledDate(now, shift.startH, shift.startM);
  const diffMin = Math.round((now-start)/60000);
  if(diffMin <= TOLERANCE_MIN) return { label:'Tepat Waktu', kind:'ok', diffMin };
  return { label:'Terlambat '+diffMin+' mnt', kind:'warn', diffMin };
}
function statusPulang(now, shift, masukDate){
  let end;
  if(shift.overnight){
    end = scheduledDate(masukDate, shift.endH, shift.endM);
    end.setDate(end.getDate()+1); // hari setelah masuk
  } else {
    end = scheduledDate(masukDate, shift.endH, shift.endM);
  }
  const diffMin = Math.round((now-end)/60000);
  if(diffMin < -TOLERANCE_MIN) return { label:'Pulang Cepat ('+Math.abs(diffMin)+' mnt)', kind:'warn', diffMin };
  return { label:'Tepat Waktu', kind:'ok', diffMin };
}
function findOpenMasuk(empId){
  // cari record hari ini atau kemarin (utk shift malam) yg sudah masuk tapi belum pulang
  const recs = S.attendance[empId] || {};
  const candidates = Object.keys(recs).sort().reverse().slice(0,3);
  for(const key of candidates){
    const r = recs[key];
    if(r && r.jamMasuk && !r.jamPulang) return { dateKey:key, rec:r };
  }
  return null;
}

/* =========================================================
   Face API helpers
   ========================================================= */
async function ensureFaceModels(onProgress){
  if(faceModelsLoaded) return;
  onProgress && onProgress('Memuat model pengenalan wajah…');
  await faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS_URL);
  faceModelsLoaded = true;
}
async function detectDescriptor(videoEl){
  const opts = new faceapi.TinyFaceDetectorOptions({ inputSize:224, scoreThreshold:0.5 });
  const result = await faceapi.detectSingleFace(videoEl, opts).withFaceLandmarks().withFaceDescriptor();
  return result ? Array.from(result.descriptor) : null;
}
async function startCamera(videoEl){
  if(!window.isSecureContext){
    throw new Error('Halaman ini belum diakses lewat HTTPS. Kamera hanya bisa dipakai jika situs dibuka lewat HTTPS (misalnya GitHub Pages), bukan dibuka langsung dari file di HP.');
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error('Browser ini tidak mendukung akses kamera, atau izin kamera diblokir. Coba pakai Chrome/Safari versi terbaru dan izinkan akses kamera saat diminta.');
  }
  const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:480}, height:{ideal:640} }, audio:false });
  videoEl.srcObject = stream;
  await videoEl.play();
  return stream;
}
function stopCamera(stream){ if(stream){ stream.getTracks().forEach(t=>t.stop()); } }

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(S.screen==='setup') html = screenSetupGuide();
  else if(S.screen==='role') html = screenRole();
  else if(S.screen==='empLogin') html = screenEmpLogin();
  else if(S.screen==='adminLogin') html = screenAdminLogin();
  else if(S.screen==='empEnroll') html = screenEmpEnroll();
  else if(S.screen==='empDashboard') html = screenEmpDashboard();
  else if(S.screen==='adminDashboard') html = screenAdminDashboard();
  else html = screenRole();

  if(S.modal) html += renderModal();
  if(S.toastMsg) html += `<div class="toast">${escapeHtml(S.toastMsg)}</div>`;

  app.innerHTML = html;
  afterRender();
}

function topbar(title, sub, opts){
  opts = opts||{};
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">GA</div>
      <div>
        <div class="brand-name">${escapeHtml(title||'Gerbang Absensi')}</div>
        <div class="brand-sub">${escapeHtml(sub||'Sistem Kehadiran Kantor')}</div>
      </div>
    </div>
    ${opts.logout ? `<button class="icon-btn" data-act="logout" title="Keluar">⎋</button>` : ''}
    ${opts.back ? `<button class="icon-btn" data-act="${opts.back}">←</button>` : ''}
  </div>`;
}

/* ---- Setup guide (jika Firebase belum dikonfigurasi) ---- */
function screenSetupGuide(){
  return `
  ${topbar('Gerbang Absensi','Belum Terhubung')}
  <div class="content guide">
    <div class="card">
      <div class="h1">⚙️ Perlu Setup Firebase</div>

/* =========================================================
   after render: side-effects (clock tick, camera, geolocation)
   ========================================================= */
let clockInterval = null;
let currentStream = null;

function afterRender(){
  clearInterval(clockInterval);
  if(S.screen==='empDashboard'){
    clockInterval = setInterval(()=>{
      const el = document.getElementById('liveClock');
      if(el) el.textContent = fmtTime(new Date()); else clearInterval(clockInterval);
    },1000);
  }

  if(S.screen==='empEnroll'){
    initEnrollCamera();
  }

  if(S.modal && S.modal.type==='absenFlow'){
    if(S.modal.step==='loc') runLocationCheck();
    if(S.modal.step==='face') initAbsenCamera();
  }

  document.body.onclick = handleClick;
}

async function initEnrollCamera(){
  const video = document.getElementById('enrollVideo');
  const statusEl = document.getElementById('enrollStatus');
  if(!video) return;
  try{
    currentStream = await startCamera(video);
    statusEl.textContent = 'Memuat model AI…';
    await ensureFaceModels();
    statusEl.textContent = 'Posisikan wajah di dalam bingkai';
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Gagal akses kamera: '+e.message;
  }
}

let enrollShots = [];
async function doEnrollCapture(){
  const video = document.getElementById('enrollVideo');
  const statusEl = document.getElementById('enrollStatus');
  const btn = document.getElementById('enrollCaptureBtn');
  if(!video) return;
  btn.disabled = true;
  statusEl.textContent = 'Mendeteksi wajah…';
  const desc = await detectDescriptor(video);
  if(!desc){
    statusEl.textContent = 'Wajah tidak terdeteksi, coba lagi.';
    btn.disabled = false;
    return;
  }
  enrollShots.push(desc);
  const dotIdx = enrollShots.length-1;
  const dot = document.getElementById('edot'+dotIdx);
  if(dot){ dot.style.background = 'var(--ok)'; }
  statusEl.textContent = `Foto ${enrollShots.length}/3 tersimpan`;
  btn.disabled = false;

  if(enrollShots.length>=3){
    // rata-ratakan descriptor
    const avg = new Array(enrollShots[0].length).fill(0);
    enrollShots.forEach(d=>{ d.forEach((v,i)=>avg[i]+=v); });
    for(let i=0;i<avg.length;i++) avg[i]/=enrollShots.length;

    statusEl.textContent = 'Menyimpan pendaftaran wajah…';
    const empId = S.session.emp.id;
    await db.ref('employees/'+empId+'/faceDescriptor').set(avg);
    stopCamera(currentStream);
    S.session.emp.faceDescriptor = avg;
    showToast('Pendaftaran wajah berhasil!');
    setScreen('empDashboard');
  } else {
    btn.textContent = 'Ambil Foto ('+enrollShots.length+'/3)';
  }
}

/* ---- Absen flow: location ---- */
async function runLocationCheck(){
  const dotEl = document.getElementById('radarDot');
  const textEl = document.getElementById('locStatusText');
  const detailEl = document.getElementById('locDetail');
  const actionsEl = document.getElementById('locActions');
  if(!textEl) return;

  if(!S.officeConfig.lat){
    textEl.textContent = 'Lokasi kantor belum diatur oleh admin.';
    if(actionsEl) actionsEl.innerHTML = `<button class="btn btn-outline" data-act="closeAbsenFlow">Tutup</button>`;
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude, longitude, accuracy} = pos.coords;
    const d = distanceMeters(latitude, longitude, S.officeConfig.lat, S.officeConfig.lng);
    const ok = d <= S.officeConfig.radius;
    if(detailEl) detailEl.textContent = `jarak ${Math.round(d)} m · akurasi GPS ±${Math.round(accuracy)} m`;
    if(dotEl && !ok) dotEl.classList.add('bad');

    if(ok){
      textEl.textContent = '✅ Anda berada di area kantor.';
      S.modal.locResult = { lat:latitude, lng:longitude, jarak:d, accuracy };
      setTimeout(()=>{ S.modal.step='face'; render(); }, 700);
    }else{
      textEl.textContent = '❌ Anda terlalu jauh dari kantor. Absen ditolak.';
      if(actionsEl) actionsEl.innerHTML = `
        <button class="btn btn-outline" data-act="retryLoc" style="margin-bottom:8px;">Coba Lagi</button>
        <button class="btn btn-ghost" data-act="closeAbsenFlow">Tutup</button>`;
    }
  }, err=>{
    textEl.textContent = 'Gagal membaca lokasi: '+err.message+'. Pastikan izin lokasi (GPS) diaktifkan.';
    if(actionsEl) actionsEl.innerHTML = `
      <button class="btn btn-outline" data-act="retryLoc" style="margin-bottom:8px;">Coba Lagi</button>
      <button class="btn btn-ghost" data-act="closeAbsenFlow">Tutup</button>`;
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
}

/* ---- Absen flow: face ---- */
async function initAbsenCamera(){
  const video = document.getElementById('absenVideo');
  const statusEl = document.getElementById('absenScanStatus');
  if(!video) return;
  try{
    currentStream = await startCamera(video);
    statusEl.textContent = 'Memuat model AI…';
    await ensureFaceModels();
    statusEl.textContent = 'Posisikan wajah di dalam bingkai';
  }catch(e){
    statusEl.textContent = 'Gagal akses kamera: '+e.message;
  }
}

async function doAbsenCapture(){
  const video = document.getElementById('absenVideo');
  const statusEl = document.getElementById('absenScanStatus');
  const btn = document.getElementById('absenCaptureBtn');
  if(!video) return;
  btn.disabled = true;
  statusEl.textContent = 'Memverifikasi wajah…';

  const desc = await detectDescriptor(video);
  if(!desc){
    statusEl.textContent = 'Wajah tidak terdeteksi, coba lagi.';
    btn.disabled = false;
    return;
  }
  const emp = S.session.emp;
  const dist = euclid(desc, emp.faceDescriptor);
  stopCamera(currentStream);

  if(dist > FACE_MATCH_THRESHOLD){
    finishAbsenFlow(false, 'Wajah tidak cocok dengan data terdaftar. Absen ditolak untuk mencegah titip absen.', null);
    return;
  }
  await commitAttendance(dist);
}

async function commitAttendance(faceDist){
  const now = new Date();
  const emp = S.session.emp;
  const mode = S.modal.mode;
  const loc = S.modal.locResult;

  if(mode==='masuk'){
    const guess = guessShiftForMasuk(now);
    const status = statusMasuk(now, guess.shift);
    const dk = todayKey(now);
    const record = {
      shift: guess.shift.key,
      jamMasuk: fmtHM(now),
      tsMasuk: now.getTime(),
      statusMasuk: status,
      lokasiMasuk: loc,
      faceMatchMasuk: faceDist
    };
    await db.ref('attendance/'+emp.id+'/'+dk).update(record);
    finishAbsenFlow(true, 'Selamat bekerja, '+emp.nama+'!', status);
  } else {
    const open = findOpenMasuk(emp.id);
    if(!open){
      finishAbsenFlow(false, 'Anda belum melakukan absen masuk.', null);
      return;
    }
    const shift = SHIFTS[open.rec.shift] || SHIFTS.shift1;
    const masukDate = new Date(open.rec.tsMasuk);
    const status = statusPulang(now, shift, masukDate);
    await db.ref('attendance/'+emp.id+'/'+open.dateKey).update({
      jamPulang: fmtHM(now),
      tsPulang: now.getTime(),
      statusPulang: status,
      lokasiPulang: loc,
      faceMatchPulang: faceDist
    });
    finishAbsenFlow(true, 'Sampai jumpa, '+emp.nama+'!', status);
  }
}

function finishAbsenFlow(success, message, status){
  S.modal.step = 'result';
  S.modal.success = success;
  S.modal.message = message;
  S.modal.status = status;
  render();
}

/* =========================================================
   Event handling
   ========================================================= */
function handleClick(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act');

  // Klik di dalam modal (input, label, area kosong) tidak boleh dianggap
  // klik di luar modal hanya karena event-nya menggelembung (bubble) sampai
  // ke backdrop. Hanya tutup modal jika yang diklik memang backdrop-nya sendiri.
  if(act === 'closeModalBg' && e.target !== el) return;

  const acts = {
    goRole: ()=> setScreen('role'),
    goEmpLogin: ()=> setScreen('empLogin'),
    goAdminLogin: ()=> setScreen('adminLogin'),
    logout: ()=>{ S.session=null; S.modal=null; setScreen('role'); },

    doEmpLogin: async ()=>{
      const nik = document.getElementById('loginNik').value.trim();
      const pin = document.getElementById('loginPin').value.trim();
      if(!nik||!pin) return showToast('Isi NIK dan PIN.');
      const found = Object.entries(S.employees).find(([id,e])=> e.nik===nik);
      if(!found || String(found[1].pin)!==pin) return showToast('NIK atau PIN salah.');
      const [id, data] = found;
      S.session = { type:'employee', emp: Object.assign({id}, data) };
      if(!data.faceDescriptor) setScreen('empEnroll'); else setScreen('empDashboard');
    },

    doAdminLogin: ()=>{
      const pin = document.getElementById('adminPinInput').value.trim();
      if(pin !== S.adminPin) return showToast('PIN admin salah.');
      S.session = { type:'admin' };
      setScreen('adminDashboard');
    },

    enrollCapture: doEnrollCapture,

    startAbsen: ()=>{
      const mode = el.getAttribute('data-mode');
      enrollShots = [];
      openModal({ type:'absenFlow', mode, step:'loc' });
    },
    retryLoc: ()=>{ S.modal.step='loc'; render(); },
    absenCapture: doAbsenCapture,
    closeAbsenFlow: ()=>{
      if(currentStream) stopCamera(currentStream);
      closeModal();
    },
    closeModalBg: ()=> closeModal(),

    adminTab: ()=>{ S.admin.tab = el.getAttribute('data-tab'); render(); },

    openAddEmp: ()=> openModal({ type:'addEmp' }),
    editEmp: ()=> openModal({ type:'addEmp', editId: el.getAttribute('data-id') }),
    deleteEmp: async ()=>{
      const id = el.getAttribute('data-id');
      if(!confirm('Hapus karyawan ini? Riwayat absensinya tetap tersimpan.')) return;
      await db.ref('employees/'+id).remove();
      showToast('Karyawan dihapus.');
    },
    saveEmp: async ()=>{
      const id = el.getAttribute('data-id');
      const nama = document.getElementById('empNama').value.trim();
      const nik = document.getElementById('empNik').value.trim();
      const pin = document.getElementById('empPin').value.trim();
      const jabatan = document.getElementById('empJabatan').value.trim();
      if(!nama||!nik||!pin) return showToast('Nama, NIK, dan PIN wajib diisi.');
      if(id){
        await db.ref('employees/'+id).update({ nama, pin, jabatan });
      }else{
        const dup = Object.values(S.employees).some(e=>e.nik===nik);
        if(dup) return showToast('NIK sudah terdaftar.');
        await db.ref('employees').push({ nama, nik, pin, jabatan, faceDescriptor:null });
      }
      closeModal();
      showToast('Data karyawan disimpan.');
    },

    useCurrentLocForOffice: ()=>{
      navigator.geolocation.getCurrentPosition(pos=>{
        document.getElementById('officeLat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('officeLng').value = pos.coords.longitude.toFixed(6);
        showToast('Lokasi saat ini diisi. Klik Simpan untuk menerapkan.');
      }, err=> showToast('Gagal ambil lokasi: '+err.message));
    },
    saveOfficeConfig: async ()=>{
      const lat = parseFloat(document.getElementById('officeLat').value);
      const lng = parseFloat(document.getElementById('officeLng').value);
      const radius = parseInt(document.getElementById('officeRadius').value)||DEFAULT_RADIUS;
      if(isNaN(lat)||isNaN(lng)) return showToast('Latitude/Longitude tidak valid.');
      await db.ref('config/office').set({ lat, lng, radius, name:'Kantor' });
      showToast('Lokasi kantor tersimpan.');
    },

    filterRekap: ()=>{ S.admin.filterDate = document.getElementById('rekapDate').value; render(); },
    exportCsv: ()=>{
      const dateKey = S.admin.filterDate;
      let csv = 'Nama,NIK,Shift,Jam Masuk,Status Masuk,Jam Pulang,Status Pulang,Jarak Masuk(m),Jarak Pulang(m),Face Match Masuk,Face Match Pulang\n';
      Object.entries(S.attendance).forEach(([empId, recs])=>{
        const r = recs[dateKey];
        if(!r) return;
        const emp = S.employees[empId]||{};
        csv += [
          emp.nama||'', emp.nik||'', r.shift||'',
          r.jamMasuk||'', r.statusMasuk?r.statusMasuk.label:'',
          r.jamPulang||'', r.statusPulang?r.statusPulang.label:'',
          r.lokasiMasuk?Math.round(r.lokasiMasuk.jarak):'',
          r.lokasiPulang?Math.round(r.lokasiPulang.jarak):'',
          r.faceMatchMasuk!=null?r.faceMatchMasuk.toFixed(3):'',
          r.faceMatchPulang!=null?r.faceMatchPulang.toFixed(3):''
        ].join(',') + '\n';
      });
      const blob = new Blob([csv], {type:'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'rekap-absensi-'+dateKey+'.csv';
      a.click();
    },
    changeAdminPin: async ()=>{
      const val = document.getElementById('newAdminPin').value.trim();
      if(val.length<4) return showToast('PIN minimal 4 digit.');
      await db.ref('config/adminPin').set(val);
      showToast('PIN admin diperbarui.');
    }
  };

  if(acts[act]) acts[act]();
}

/* =========================================================
   Boot
   ========================================================= */
if(firebaseReady){
  loadAllData(()=> render());
} else {
  render();
}
</script>
